<header class="encabezado">
  <div>
    <p class="sobre">Ventanilla</p>
    <h2>Operaciones</h2>
  </div>
</header>
<div class="pestanas">
  <button type="button" [class.activa]="pestana() === 'deposito'" (click)="cambiar('deposito')">Depósito</button>
  <button type="button" [class.activa]="pestana() === 'retiro'" (click)="cambiar('retiro')">Retiro</button>
  <button type="button" [class.activa]="pestana() === 'transferencia'" (click)="cambiar('transferencia')">Transferencia</button>
</div>
@if (mensaje()) { <p class="alerta ok">{{ mensaje() }}</p> }
@if (error()) { <p class="alerta error">{{ error() }}</p> }
@if (pestana() === 'deposito') {
  <form class="tarjeta formulario" [formGroup]="deposito" (ngSubmit)="depositar()">
    <div class="campos">
      <label>Cuenta
        <select formControlName="cuentaId">
          <option value="">Seleccione</option>
          @for (cuenta of cuentas(); track cuenta.id) {
            <option [value]="cuenta.id">{{ cuenta.numeroCuenta }} · {{ cuenta.clienteNombre }} · {{ moneda(cuenta.saldo) }}</option>
          }
        </select>
      </label>
      <label>Monto<input type="number" step="0.01" min="0.01" formControlName="monto" /></label>
      <label class="ancho">Descripción<input formControlName="descripcion" /></label>
    </div>
    <button class="boton" type="submit">Registrar depósito</button>
  </form>
}
@if (pestana() === 'retiro') {
  <form class="tarjeta formulario" [formGroup]="retiro" (ngSubmit)="retirar()">
    <div class="campos">
      <label>Cuenta
        <select formControlName="cuentaId">
          <option value="">Seleccione</option>
          @for (cuenta of cuentas(); track cuenta.id) {
            <option [value]="cuenta.id">{{ cuenta.numeroCuenta }} · {{ cuenta.clienteNombre }} · {{ moneda(cuenta.saldo) }}</option>
          }
        </select>
      </label>
      <label>Monto<input type="number" step="0.01" min="0.01" formControlName="monto" /></label>
      <label class="ancho">Descripción<input formControlName="descripcion" /></label>
    </div>
    <button class="boton" type="submit">Registrar retiro</button>
  </form>
}
@if (pestana() === 'transferencia') {
  <form class="tarjeta formulario" [formGroup]="transferencia" (ngSubmit)="transferir()">
    <div class="campos">
      <label>Cuenta origen
        <select formControlName="cuentaOrigenId">
          <option value="">Seleccione</option>
          @for (cuenta of cuentas(); track cuenta.id) {
            <option [value]="cuenta.id">{{ cuenta.numeroCuenta }} · {{ moneda(cuenta.saldo) }}</option>
          }
        </select>
      </label>
      <label>Cuenta destino
        <select formControlName="cuentaDestinoId">
          <option value="">Seleccione</option>
          @for (cuenta of cuentas(); track cuenta.id) {
            <option [value]="cuenta.id">{{ cuenta.numeroCuenta }} · {{ cuenta.clienteNombre }}</option>
          }
        </select>
      </label>
      <label>Monto<input type="number" step="0.01" min="0.01" formControlName="monto" /></label>
      <label>Concepto<input formControlName="concepto" /></label>
    </div>
    <button class="boton" type="submit">Transferir</button>
  </form>
}
