<header class="encabezado">
  <div>
    <p class="sobre">Apertura</p>
    <h2>Abrir cuenta</h2>
  </div>
  <a class="boton secundario" routerLink="/cuentas">Volver</a>
</header>
<form class="tarjeta formulario" [formGroup]="formulario" (ngSubmit)="guardar()">
  @if (error()) { <p class="alerta error">{{ error() }}</p> }
  <div class="campos">
    <label>
      Cliente activo
      <select formControlName="clienteId">
        <option value="">Seleccione</option>
        @for (cliente of clientes(); track cliente.id) {
          <option [value]="cliente.id">{{ cliente.codigo }} · {{ cliente.nombres }} {{ cliente.apellidos }}</option>
        }
      </select>
    </label>
    <label>
      Tipo de cuenta
      <select formControlName="tipoCuentaId">
        <option value="">Seleccione</option>
        @for (tipo of tipos(); track tipo.id) {
          <option [value]="tipo.id">{{ tipo.nombre }}</option>
        }
      </select>
    </label>
  </div>
  <p class="ayuda">El saldo inicial es Q 0.00 y el número lo asigna el sistema.</p>
  <button class="boton" type="submit" [disabled]="enviando()">{{ enviando() ? 'Abriendo…' : 'Abrir cuenta' }}</button>
</form>
