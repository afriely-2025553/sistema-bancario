<svg xmlns="http://www.w3.org/2000/svg" width="980" height="860" viewBox="0 0 980 860">
  <rect width="980" height="860" fill="#f4f1ea"/>
  <text x="40" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0e2a47">Flujo de depósito</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0e2a47">
    <rect x="330" y="80" width="280" height="48" rx="24" fill="#0e2a47"/>
    <text x="470" y="110" text-anchor="middle" fill="#ffffff">Inicio</text>
    <rect x="270" y="160" width="400" height="52" rx="8" fill="#ffffff" stroke="#0e2a47"/>
    <text x="470" y="192" text-anchor="middle">Recibir cuenta y monto con JWT</text>
    <polygon points="470,250 670,310 470,370 270,310" fill="#fff8ea" stroke="#b0893e" stroke-width="2"/>
    <text x="470" y="306" text-anchor="middle">¿Monto &gt; 0 y</text>
    <text x="470" y="326" text-anchor="middle">con dos decimales?</text>
    <polygon points="470,410 690,480 470,550 250,480" fill="#fff8ea" stroke="#b0893e" stroke-width="2"/>
    <text x="470" y="472" text-anchor="middle">¿Cuenta existente,</text>
    <text x="470" y="492" text-anchor="middle">activa y cliente activo?</text>
    <rect x="250" y="590" width="440" height="70" rx="8" fill="#e7f4f1" stroke="#1f6f6a"/>
    <text x="470" y="618" text-anchor="middle">Transacción: suma saldo y</text>
    <text x="470" y="640" text-anchor="middle">inserta movimiento depósito</text>
    <rect x="720" y="450" width="220" height="64" rx="8" fill="#fdecec" stroke="#9b2c2c"/>
    <text x="830" y="478" text-anchor="middle" fill="#9b2c2c">Rechazar</text>
    <text x="830" y="498" text-anchor="middle" fill="#9b2c2c">sin cambiar saldo</text>
    <rect x="330" y="700" width="280" height="48" rx="24" fill="#0e2a47"/>
    <text x="470" y="730" text-anchor="middle" fill="#ffffff">Fin</text>
    <path d="M470 128 V160 M470 212 V250 M470 370 V410 M470 550 V590 M470 660 V700" stroke="#0e2a47" fill="none" stroke-width="1.6"/>
    <path d="M690 480 H720" stroke="#9b2c2c" fill="none" stroke-width="1.6"/>
    <text x="500" y="400" fill="#1f6f6a">Sí</text>
    <text x="700" y="468" fill="#9b2c2c">No</text>
  </g>
</svg>
