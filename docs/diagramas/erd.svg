<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#f4f1ea"/>
  <text x="36" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0e2a47">Diagrama entidad-relación</text>
  <text x="36" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5346">Claves primarias en verde. Claves foráneas en ámbar. Cardinalidad indicada sobre la relación.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Cliente -->
    <g transform="translate(40,100)">
      <rect width="280" height="250" rx="10" fill="#ffffff" stroke="#0e2a47"/>
      <rect width="280" height="36" rx="10" fill="#0e2a47"/>
      <rect y="20" width="280" height="16" fill="#0e2a47"/>
      <text x="140" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Cliente</text>
      <text x="16" y="58" font-size="13" fill="#1f6f6a" font-weight="700">PK id</text>
      <text x="16" y="80" font-size="13" fill="#0e2a47">codigo, identificacion UK</text>
      <text x="16" y="102" font-size="13" fill="#0e2a47">nombres, apellidos</text>
      <text x="16" y="124" font-size="13" fill="#0e2a47">fecha_nacimiento</text>
      <text x="16" y="146" font-size="13" fill="#0e2a47">telefono, correo</text>
      <text x="16" y="168" font-size="13" fill="#0e2a47">direccion</text>
      <text x="16" y="190" font-size="13" fill="#0e2a47">activo</text>
      <text x="16" y="212" font-size="13" fill="#0e2a47">fecha_registro</text>
    </g>

    <!-- TipoCuenta -->
    <g transform="translate(40,400)">
      <rect width="280" height="168" rx="10" fill="#ffffff" stroke="#0e2a47"/>
      <rect width="280" height="36" rx="10" fill="#0e2a47"/>
      <rect y="20" width="280" height="16" fill="#0e2a47"/>
      <text x="140" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">TipoCuenta</text>
      <text x="16" y="58" font-size="13" fill="#1f6f6a" font-weight="700">PK id</text>
      <text x="16" y="80" font-size="13" fill="#0e2a47">nombre UK</text>
      <text x="16" y="102" font-size="13" fill="#0e2a47">descripcion</text>
      <text x="16" y="124" font-size="13" fill="#0e2a47">activo</text>
    </g>

    <!-- Usuario -->
    <g transform="translate(40,620)">
      <rect width="280" height="210" rx="10" fill="#ffffff" stroke="#0e2a47"/>
      <rect width="280" height="36" rx="10" fill="#0e2a47"/>
      <rect y="20" width="280" height="16" fill="#0e2a47"/>
      <text x="140" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Usuario</text>
      <text x="16" y="58" font-size="13" fill="#1f6f6a" font-weight="700">PK id</text>
      <text x="16" y="80" font-size="13" fill="#0e2a47">nombre_usuario UK</text>
      <text x="16" y="102" font-size="13" fill="#0e2a47">contrasena_hash</text>
      <text x="16" y="124" font-size="13" fill="#0e2a47">nombre_completo</text>
      <text x="16" y="146" font-size="13" fill="#0e2a47">rol</text>
      <text x="16" y="168" font-size="13" fill="#0e2a47">activo, fecha_creacion</text>
    </g>

    <!-- Cuenta -->
    <g transform="translate(460,250)">
      <rect width="320" height="250" rx="10" fill="#ffffff" stroke="#0e2a47"/>
      <rect width="320" height="36" rx="10" fill="#0e2a47"/>
      <rect y="20" width="320" height="16" fill="#0e2a47"/>
      <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Cuenta</text>
      <text x="16" y="58" font-size="13" fill="#1f6f6a" font-weight="700">PK id</text>
      <text x="16" y="80" font-size="13" fill="#0e2a47">numero_cuenta UK</text>
      <text x="16" y="102" font-size="13" fill="#b0893e" font-weight="700">FK cliente_id</text>
      <text x="16" y="124" font-size="13" fill="#b0893e" font-weight="700">FK tipo_cuenta_id</text>
      <text x="16" y="146" font-size="13" fill="#0e2a47">saldo decimal(15,2)</text>
      <text x="16" y="168" font-size="13" fill="#0e2a47">estado activa | inactiva</text>
      <text x="16" y="190" font-size="13" fill="#0e2a47">fecha_apertura</text>
    </g>

    <!-- Transferencia -->
    <g transform="translate(980,90)">
      <rect width="380" height="250" rx="10" fill="#ffffff" stroke="#0e2a47"/>
      <rect width="380" height="36" rx="10" fill="#0e2a47"/>
      <rect y="20" width="380" height="16" fill="#0e2a47"/>
      <text x="190" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Transferencia</text>
      <text x="16" y="58" font-size="13" fill="#1f6f6a" font-weight="700">PK id</text>
      <text x="16" y="80" font-size="13" fill="#b0893e" font-weight="700">FK cuenta_origen_id</text>
      <text x="16" y="102" font-size="13" fill="#b0893e" font-weight="700">FK cuenta_destino_id</text>
      <text x="16" y="124" font-size="13" fill="#b0893e" font-weight="700">FK usuario_id</text>
      <text x="16" y="146" font-size="13" fill="#0e2a47">monto, referencia UK</text>
      <text x="16" y="168" font-size="13" fill="#0e2a47">concepto, fecha</text>
    </g>

    <!-- Movimiento -->
    <g transform="translate(980,430)">
      <rect width="380" height="310" rx="10" fill="#ffffff" stroke="#0e2a47"/>
      <rect width="380" height="36" rx="10" fill="#0e2a47"/>
      <rect y="20" width="380" height="16" fill="#0e2a47"/>
      <text x="190" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Movimiento</text>
      <text x="16" y="58" font-size="13" fill="#1f6f6a" font-weight="700">PK id</text>
      <text x="16" y="80" font-size="13" fill="#b0893e" font-weight="700">FK cuenta_id</text>
      <text x="16" y="102" font-size="13" fill="#b0893e" font-weight="700">FK transferencia_id</text>
      <text x="16" y="124" font-size="13" fill="#b0893e" font-weight="700">FK usuario_id</text>
      <text x="16" y="146" font-size="13" fill="#0e2a47">tipo</text>
      <text x="16" y="168" font-size="13" fill="#0e2a47">monto</text>
      <text x="16" y="190" font-size="13" fill="#0e2a47">saldo_anterior, saldo_posterior</text>
      <text x="16" y="212" font-size="13" fill="#0e2a47">descripcion, fecha</text>
    </g>
  </g>

  <g stroke="#1f6f6a" stroke-width="1.8" fill="none" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <path d="M320 210 H390 V340 H460" stroke="#1f6f6a"/>
    <text x="360" y="200" fill="#1f6f6a" stroke="none">1</text>
    <text x="400" y="330" fill="#1f6f6a" stroke="none">N  posee</text>

    <path d="M320 480 H390 V430 H460" stroke="#1f6f6a"/>
    <text x="340" y="470" fill="#1f6f6a" stroke="none">1</text>
    <text x="400" y="420" fill="#1f6f6a" stroke="none">N  clasifica</text>

    <path d="M780 340 H900 V190 H980" stroke="#1f6f6a"/>
    <text x="800" y="330" fill="#1f6f6a" stroke="none">1 origen</text>
    <path d="M780 420 H900 V250 H980" stroke="#1f6f6a"/>
    <text x="800" y="450" fill="#1f6f6a" stroke="none">1 destino</text>

    <path d="M780 470 H900 V560 H980" stroke="#1f6f6a"/>
    <text x="800" y="500" fill="#1f6f6a" stroke="none">1 cuenta</text>
    <text x="900" y="548" fill="#1f6f6a" stroke="none">N movimientos</text>

    <path d="M1170 340 V430" stroke="#1f6f6a"/>
    <text x="1180" y="390" fill="#1f6f6a" stroke="none">1 a N</text>

    <path d="M180 620 V568" stroke="#1f6f6a"/>
    <path d="M180 568 H1100 V340" stroke="#1f6f6a"/>
    <text x="200" y="560" fill="#1f6f6a" stroke="none">Usuario 1 registra N transferencias y N movimientos</text>
  </g>
</svg>
