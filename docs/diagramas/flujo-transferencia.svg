<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980">
  <rect width="1100" height="980" fill="#f4f1ea"/>
  <text x="40" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0e2a47">Flujo de transferencia</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0e2a47">
    <rect x="390" y="76" width="280" height="46" rx="23" fill="#0e2a47"/>
    <text x="530" y="105" text-anchor="middle" fill="#ffffff">Inicio</text>
    <rect x="300" y="150" width="460" height="50" rx="8" fill="#ffffff" stroke="#0e2a47"/>
    <text x="530" y="180" text-anchor="middle">Recibir origen, destino y monto</text>
    <polygon points="530,230 740,290 530,350 320,290" fill="#fff8ea" stroke="#b0893e" stroke-width="2"/>
    <text x="530" y="286" text-anchor="middle">¿Origen y destino</text>
    <text x="530" y="306" text-anchor="middle">son cuentas distintas?</text>
    <polygon points="530,390 760,460 530,530 300,460" fill="#fff8ea" stroke="#b0893e" stroke-width="2"/>
    <text x="530" y="452" text-anchor="middle">¿Ambas existen, activas</text>
    <text x="530" y="472" text-anchor="middle">y con cliente activo?</text>
    <polygon points="530,570 760,640 530,710 300,640" fill="#fff8ea" stroke="#b0893e" stroke-width="2"/>
    <text x="530" y="632" text-anchor="middle">¿El origen tiene</text>
    <text x="530" y="652" text-anchor="middle">saldo suficiente?</text>
    <rect x="280" y="750" width="500" height="78" rx="8" fill="#e7f4f1" stroke="#1f6f6a"/>
    <text x="530" y="778" text-anchor="middle">En una transacción: restar origen, sumar destino,</text>
    <text x="530" y="800" text-anchor="middle">guardar transferencia y dos movimientos</text>
    <rect x="820" y="600" width="230" height="70" rx="8" fill="#fdecec" stroke="#9b2c2c"/>
    <text x="935" y="628" text-anchor="middle" fill="#9b2c2c">Rechazar y</text>
    <text x="935" y="648" text-anchor="middle" fill="#9b2c2c">revertir</text>
    <rect x="390" y="870" width="280" height="46" rx="23" fill="#0e2a47"/>
    <text x="530" y="899" text-anchor="middle" fill="#ffffff">Fin</text>
    <path d="M530 122 V150 M530 200 V230 M530 350 V390 M530 530 V570 M530 710 V750 M530 828 V870" stroke="#0e2a47" fill="none" stroke-width="1.6"/>
    <path d="M760 640 H820" stroke="#9b2c2c" fill="none"/>
    <text x="560" y="376" fill="#1f6f6a">Sí</text>
    <text x="770" y="628" fill="#9b2c2c">No</text>
  </g>
</svg>
